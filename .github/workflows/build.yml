name: Build Windows
on:
  push:
    branches: ['master', 'codex/rename-procurement-export', 'codex/in-app-updates-20261114']
  pull_request:
    branches: ['master']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: New-Item -ItemType Directory -Force .test-output | Out-Null
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify complete update assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/verify-update-assets.mjs release $version
          if ($LASTEXITCODE -ne 0) { throw 'Update asset verification failed' }
      - name: Check real Electron update UI and IPC with isolated data
        run: node tests/update-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: procurement-order-export-windows
          path: |
            release/*Setup.exe
            release/latest.yml
          if-no-files-found: error
