name: Build Windows
on:
  push:
    branches: ['master', 'codex/rename-procurement-export']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: New-Item -ItemType Directory -Force .test-output | Out-Null
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: procurement-order-export-windows
          path: release/*Setup.exe
          if-no-files-found: error
