name: Build Windows
on:
  push:
    branches: ['master', 'codex/rename-procurement-export', 'codex/in-app-updates-20261114', 'codex/local-ai-api-20261116']
  pull_request:
    branches: ['master']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: New-Item -ItemType Directory -Force .test-output | Out-Null
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify complete update assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/verify-update-assets.mjs release $version
          if ($LASTEXITCODE -ne 0) { throw 'Update asset verification failed' }
      - name: Check real Electron update UI and IPC with isolated data
        run: node tests/update-ui-smoke.mjs
      - name: Verify local API and Codex MCP with isolated orders
        run: node tests/local-ai-smoke.mjs
      - name: Verify four-step collection with isolated data
        run: node tests/plan-ui-smoke.mjs
      - name: Verify independent platform collectors and export snapshots
        run: node tests/platform-concurrency-smoke.mjs
      - name: Verify concurrent platform switching and background verification
        run: node tests/platform-concurrency-ui-smoke.mjs
      - name: Verify visible collection activity
        run: node tests/collection-activity-smoke.mjs
      - name: Verify detail export errors and completion with isolated data
        run: node tests/details-platforms-smoke.mjs
      - name: Verify primary checkpoint continuation
        run: node tests/primary-resume-smoke.mjs
      - name: Verify isolated 1688 official-mode preparation UI
        run: node tests/alibaba-official-ui-smoke.mjs
      - name: Verify default-enabled official export and explicit disable
        run: node tests/alibaba-official-enabled-smoke.mjs
      - name: Verify cross-year official month selection
        run: node tests/alibaba-official-cross-year-smoke.mjs
      - name: Verify official export download and import with synthetic data
        run: node tests/alibaba-official-integration-smoke.mjs
      - name: Verify 1688 login iframe recovery
        run: node tests/platform-login-smoke.mjs
      - name: Verify single-instance update safety
        run: node tests/update-single-instance-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: procurement-order-export-windows
          path: |
            release/*Setup.exe
            release/latest.yml
          if-no-files-found: error
