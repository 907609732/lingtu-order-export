name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Windows run ID
        required: true
      tag:
        description: Existing draft release tag
        required: true
      sha256:
        description: Expected installer SHA-256
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify build and download installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh run view $env:SOURCE_RUN --json conclusion,headSha,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success') { throw 'Source build did not succeed' }
          if ($run.workflowName -ne 'Build Windows') { throw 'Unexpected source workflow' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid stable release tag' }
          if ($env:EXPECTED_SHA -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid expected SHA-256' }
          $release = gh release view $env:RELEASE_TAG --json isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Expected an existing draft release' }
          if ($release.targetCommitish -ne $run.headSha) { throw 'Release target differs from build source' }
          $tagSha = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $run.headSha) { throw 'Release tag differs from build source' }
          gh run download $env:SOURCE_RUN --name procurement-order-export-windows --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $files = @(Get-ChildItem release/*Setup.exe)
          if ($files.Count -ne 1) { throw 'Expected one installer' }
          if ((Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_SHA.ToLowerInvariant()) { throw 'Installer checksum mismatch' }
          node scripts/verify-update-assets.mjs release $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest verification failed' }
      - name: Upload and publish verified installer
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*Setup.exe
          # Full installer first; expose manifest only after the installer exists.
          gh release upload $env:RELEASE_TAG $file.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release upload $env:RELEASE_TAG release/latest.yml
          if ($LASTEXITCODE -ne 0) { throw 'Manifest upload failed' }
          gh release download $env:RELEASE_TAG --dir verified --pattern '*Setup.exe' --pattern latest.yml
          if ($LASTEXITCODE -ne 0) { throw 'Uploaded update assets could not be downloaded' }
          node scripts/verify-update-assets.mjs verified $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Uploaded update assets differ from manifest' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
