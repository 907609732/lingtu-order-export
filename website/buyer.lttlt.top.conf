server {
    server_name buyer.lttlt.top;

    root /var/www/buyer.lttlt.top/current;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    location = /release.json { add_header Cache-Control "no-cache"; }
    location ~* \.(png|ico|svg|jpg|webp)$ { expires 7d; try_files $uri =404; }
    index index.html;
    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/buyer.lttlt.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/buyer.lttlt.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = buyer.lttlt.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name buyer.lttlt.top;
    return 404; # managed by Certbot


}
